
name: TeaHack APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found"
            exit 1
          fi

          echo "sdk.dir=$SDK" > local.properties
          echo "SDK: $SDK"

      - name: Extract Project
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP=$(find . -maxdepth 3 -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -1)

          if [ -n "$ZIP" ]; then
            echo "Extracting: $ZIP"
            unzip -o "$ZIP" -d extracted
          else
            echo "Using repository source"
            cp -a . extracted/
          fi

          find extracted -maxdepth 4 -type f | head -80

      - name: Locate Gradle Project
        shell: bash
        run: |
          set -e

          FILE=$(find extracted -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$FILE" ]; then
            echo "::error::Missing settings.gradle"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Project: $DIR"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ -f gradlew ] && \
             [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          fi

      - name: Show Error Summary
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            echo "===== BUILD ERRORS ====="
            grep -n -A 25 -B 8 \
              -E 'What went wrong|FAILURE:|error:|Could not resolve|Could not find|Execution failed' \
              build.log | head -250 || true
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeaHack-Build-Logs
          path: build.log
          if-no-files-found: ignore

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          mkdir -p output

          find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -exec cp {} output/ \;

          if ! find output -name "*.apk" | grep -q .; then
            echo "::error::No APK generated"
            exit 1
          fi

          ls -lh output

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TeaHackGlass-APK
          path: output/*.apk
          if-no-files-found: error
